<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Synergy Module</title>
  <desc id="desc">Developers, traders, and entrepreneurs building together</desc>
  <defs>
