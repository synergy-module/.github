<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
  <title id="title">The Synergy loop</title>
  <desc id="desc">An animated signal travels through Build, Test, Learn, and Improve.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101018"/>
      <stop offset="1" stop-color="#210f1a"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff304b"/>
      <stop offset="0.5" stop-color="#ff8a75"/>
      <stop offset="1" stop-color="#ff304b"/>
    </linearGradient>
    <radialGradient id="signal">
      <stop offset="0" stop-color="#ffd1cf" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ff304b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
  </defs>
  <rect width="1200" height="190" rx="18" fill="url(#background)"/>
  <rect width="1200" height="190" rx="18" fill="url(#grid)"/>
  <rect x="0" y="0" width="7" height="190" fill="#ff4056"/>
  <text x="48" y="41" fill="#e2ccd2" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3">THE WAY WE WORK</text>
  <path d="M148 91H1048" fill="none" stroke="#ffb2b8" stroke-opacity="0.22" stroke-width="3" stroke-linecap="round"/>
  <path d="M148 91H1048" fill="none" stroke="url(#track)" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="10 16">
    <animate attributeName="stroke-dashoffset" values="0;-208" dur="12s" repeatCount="indefinite"/>
  </path>
  <circle cx="148" cy="91" r="24" fill="url(#signal)" opacity="0">
    <animate attributeName="cx" values="148;1048;1048" keyTimes="0;0.9;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.08;0.9;1" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="148" cy="91" r="5" fill="#ffe6e2" opacity="0">
    <animate attributeName="cx" values="148;1048;1048" keyTimes="0;0.9;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="10s" repeatCount="indefinite"/>
  </circle>
  <g fill="#170f18" stroke="#ff6975" stroke-width="2">
    <circle cx="148" cy="91" r="15"><animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="10s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="448" cy="91" r="15"><animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="10s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="748" cy="91" r="15"><animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="10s" begin="6s" repeatCount="indefinite"/></circle>
    <circle cx="1048" cy="91" r="15"><animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="10s" begin="9s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#ff5366">
    <circle cx="148" cy="91" r="5"/>
    <circle cx="448" cy="91" r="5"/>
    <circle cx="748" cy="91" r="5"/>
    <circle cx="1048" cy="91" r="5"/>
  </g>
  <g fill="#fff5f4" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="2.5" text-anchor="middle">
    <text x="148" y="147">BUILD</text>
    <text x="448" y="147">TEST</text>
    <text x="748" y="147">LEARN</text>
    <text x="1048" y="147">IMPROVE</text>
  </g>
</svg>
